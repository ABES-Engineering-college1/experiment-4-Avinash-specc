<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment4</title>
</head>
<body>
    <form action="response.html"  target="_blank" name="HotelBookingform" align="center">
        <h1>Hotel Room Booking Form</h1>
        <label for="Full Name">
        Full Name:</label><input type="text" name="name" id="Full Name" >
        <br><br>
        <label for="Email">
        Email:</label> <input type="email" name="email" id="Email">
    <br><br>
        <label for="Phone">
        Phone:</label> <input type="tel" name="Phone" id="Phone" >
        <br><br>
        <label for="check-in">
        Check-in Date: </label><input type="date" name="Check-in Date" id="check-in" >
        <br><br>
            <label for="check-out">
                Check-out Date: </label> <input type="date" name="Check-out Date" id="check-out" >
                <br><br>
                <label for="select">
                Room Type: </label><select name="Room preferences" id="select">
                    <br><br>
                    <option value="Single Room">Single Room</option>
                    <option value="Double bedroom">Double bedroom</option>
                </select>
                <br><br>
                <label for="guests">
               Number of Guests: </label><input type="number" id="guests" name="guestno." min="1" max="6">
               <br><br>
                <label for="sr"><center>Special Requests:</center>
                <textarea name="special requests" id="sr" rows="3" cols="50"></textarea>
                </label>
                <br><br>
                <button type="submit">Book Now</button>
                <button type="reset">Reset Form</button>
    </form>
</body>
</html>
